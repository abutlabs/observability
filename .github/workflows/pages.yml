# https://abutlabs.github.io/observability/ used to serve the course; the course now lives
# on jam-learning (https://abutlabs.github.io/jam-learning/observability/). This publishes
# pages/redirect.html as the front page, lesson.html and the 404 page, so every old link,
# lesson.html?lesson=... included, lands on the same page there.
# Needs the repository's Pages source set to "GitHub Actions".
name: Course redirect

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build the redirect
        run: |
          mkdir _site
          for page in index lesson 404; do cp pages/redirect.html "_site/$page.html"; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
